apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      version: v4.4
  template:
    metadata:
      labels:
        app: frontend
        version: v4.4
    spec:
      containers:
      - name: frontend
        image: muteeat/shopeasy-frontend:v4.4
        ports:
        - containerPort: 8080
